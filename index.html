<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PeaCorp · Prototipo MVP</title>
<meta name="description" content="Prototipo de PeaCorp: encuentra moda y accesorios de tiendas de Cúcuta escribiendo lo que buscas.">
<meta name="theme-color" content="#344E41">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23344E41'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23A3B18A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
/* ===== Paleta oficial PeaCorp ===== */
:root{--pine:#344E41;--hunter:#3A5A40;--fern:#588157;--sage:#A3B18A;--dust:#DAD7CD;--cream:#F4F1E8;--ink:#233229;--muted:#5f6d63;--line:#e3dfd2;--amber:#B9791F;--r:16px;--sh:0 4px 16px rgba(52,78,65,.12)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;accent-color:var(--fern);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.45}
h1,h2,h3,h4{font-family:Georgia,"Times New Roman",serif;color:var(--pine);margin:0 0 .4em}
h1{font-size:2.1rem;line-height:1.15}h2{font-size:1.45rem}h3{font-size:1.08rem}
p{margin:0 0 .7em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #E0A526;outline-offset:2px}
.sform input:focus-visible{outline-color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}.small{font-size:.85rem}.right{text-align:right}

/* Encabezado */
header.top{background:var(--pine);color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.18)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:Georgia,serif;font-size:1.45rem;font-weight:700;cursor:pointer;background:none;border:0;color:#fff;padding:0}
nav.nav{display:flex;gap:4px;margin-left:8px;flex-wrap:wrap}
.nav button{background:none;border:0;color:var(--dust);padding:8px 14px;border-radius:999px;cursor:pointer}
.nav button.on,.nav button:hover{background:var(--hunter);color:#fff}
.nav .n{background:var(--sage);color:var(--pine);border-radius:99px;font-size:.72rem;font-weight:700;padding:1px 7px;margin-left:4px}
.sw{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.92rem}
.switch{width:46px;height:25px;border-radius:99px;background:var(--hunter);border:1px solid var(--sage);position:relative;cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s}
.switch[aria-checked=true]{background:var(--fern)}
.switch[aria-checked=true]::after{left:24px}
.modo-tag{background:var(--sage);color:var(--pine);border-radius:99px;padding:3px 12px;font-size:.8rem;font-weight:700}

main{padding:24px 0 40px;flex:1}
footer{background:var(--pine);color:var(--dust);padding:18px 0;font-size:.82rem}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
footer button{background:none;border:1px solid var(--sage);color:var(--dust);border-radius:99px;padding:3px 12px;font-size:.78rem;cursor:pointer;opacity:.75}
footer button:hover{opacity:1}

/* Botones */
.btn{border:0;border-radius:999px;padding:10px 20px;cursor:pointer;font-weight:600;background:var(--fern);color:#fff;transition:.15s}
.btn:hover{background:var(--hunter)}
.btn.alt{background:#fff;color:var(--hunter);border:1.5px solid var(--fern)}
.btn.alt:hover{background:var(--dust)}
.btn.sm{padding:6px 14px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.warn{background:#8F5C12}
.link{background:none;border:0;color:var(--hunter);text-decoration:underline;cursor:pointer;padding:0;font-size:.85rem}

/* Tarjetas */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.prod{padding:0;overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.prod:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(52,78,65,.2)}
.img{background:linear-gradient(145deg,#ECE8DC,var(--dust));aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;position:relative}
.img svg{width:62%;height:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
.img .tag{position:absolute;top:10px;left:10px}
.prod .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.prod h3{margin:0;font-size:1rem}
.precio{font-size:1.2rem;font-weight:700;color:var(--hunter)}
.stars{color:#C08A1E;letter-spacing:1px}
/* Reseñas */
.rs-sum{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:center;margin:14px 0 6px}
.rs-big{text-align:center}.rs-big b{font-family:Georgia,serif;font-size:3rem;color:var(--pine);line-height:1}
.rs-bars{display:grid;gap:7px}
.gt{width:100%;border-collapse:collapse;margin:10px 0}
.gt th,.gt td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center}
.gt th{font-size:.8rem;color:var(--muted);font-weight:600}
.gt td:first-child,.gt th:first-child{text-align:left;font-weight:700}
.gt tr.on td{background:#EEF2E6}
.talla-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rb-row{display:grid;grid-template-columns:36px 1fr 34px;gap:10px;align-items:center;font-size:.85rem;color:var(--muted)}
.rb-track{height:10px;border-radius:99px;background:var(--dust);overflow:hidden}
.rb-fill{height:100%;border-radius:99px;background:#C08A1E}
.rev{padding:14px 0;border-top:1px solid var(--line)}
.rev:first-of-type{border-top:0}
.rev-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ia{margin:18px 0 4px;padding:16px 18px;border-radius:14px;background:linear-gradient(135deg,#EEF2E6,var(--cream));border:1px solid var(--sage)}
.ia-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.ia-h h4{margin:0}
.ia-tag{font-size:.72rem;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--pine);color:#fff}
.ia-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.ia-cols h5{margin:0 0 5px;font-size:.82rem;color:var(--pine)}
.ia-chips{display:flex;gap:6px;flex-wrap:wrap}
.ia-chips span{font-size:.8rem;background:#fff;border:1px solid var(--sage);border-radius:99px;padding:3px 10px}
.ia-chips.neg span{border-color:#E3C58F;background:#FBF4E4}
.mini{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mini .prod h3{font-size:.85rem}.mini .precio{font-size:1rem}
.mini .body{padding:8px 10px 10px;gap:2px}.mini .small{font-size:.75rem}
.mini .tags,.mini .bd,.mini .tag{display:none}
@media(max-width:640px){.ia-cols{grid-template-columns:1fr}}
.rs-sec{margin-top:20px;padding-top:6px;border-top:2px solid var(--line)}
@media(max-width:640px){.rs-sum{grid-template-columns:1fr}}

.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.tg{font-size:.72rem;border-radius:99px;padding:2px 9px;background:var(--dust);color:var(--pine);font-weight:600}
.tag{font-size:.72rem;border-radius:99px;padding:3px 10px;font-weight:700}
.tag.dest{background:var(--pine);color:#fff}
.tag.prio{background:var(--sage);color:var(--pine)}
.bd{display:inline-flex;align-items:center;gap:3px;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.bd.v{background:var(--fern);color:#fff}
.bd.i{background:#fff;color:var(--hunter);border:1px solid var(--sage)}

/* Buscador */
.hero{background:linear-gradient(135deg,var(--pine),var(--hunter));color:#fff;border-radius:22px;padding:30px 30px 24px;margin-bottom:22px}
.hero h1{color:#fff}.hero p{color:var(--dust)}
.sform{display:flex;gap:10px;margin:14px 0 10px}
.sform input{flex:1;border:0;border-radius:999px;padding:14px 22px;font-size:1.05rem;min-width:0;color:var(--ink);background:#fff}
.sform input::placeholder{color:#6b756e}
.sform .btn.go{background:#fff;color:var(--pine)}
.sform .btn.go:hover{background:var(--dust)}
.sform .cam{background:var(--dust);color:var(--pine);border:0;border-radius:50%;width:50px;cursor:pointer;font-size:1.2rem}
.ejs{display:flex;gap:8px;flex-wrap:wrap;font-size:.85rem;align-items:center}
.ejs button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:99px;padding:4px 12px;cursor:pointer}
.ejs button:hover{background:rgba(255,255,255,.25)}
.filtros{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.filtros label{display:flex;flex-direction:column;font-size:.78rem;font-weight:600;color:var(--muted);gap:3px}
.filtros select,.filtros input[type=number]{border:1px solid var(--sage);border-radius:10px;padding:7px 10px;background:#fff;min-width:110px}
.filtros .chk{flex-direction:row;align-items:center;gap:6px;padding-bottom:8px;font-size:.9rem;color:var(--ink)}
.entendi{background:#fff;border:1px dashed var(--sage);border-radius:12px;padding:9px 12px;margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:var(--dust);color:var(--pine);border-radius:99px;padding:3px 6px 3px 12px;font-size:.85rem;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.chip button{border:0;background:var(--sage);color:var(--pine);border-radius:50%;width:19px;height:19px;cursor:pointer;line-height:1;padding:0;font-weight:700}
.rhead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.vacio{text-align:center;padding:40px 20px}
.vacio .big{font-size:3rem}

/* Ficha */
.ficha{display:grid;grid-template-columns:1fr 1.1fr;gap:26px;align-items:start}
.ficha .img{border-radius:var(--r);aspect-ratio:1/1;position:sticky;top:84px}
.ficha .acc{padding-bottom:4px}
.ficha .img svg{width:58%}
.vend{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--cream);border-radius:12px;padding:12px 14px;margin:12px 0;flex-wrap:wrap}
table.tec{width:100%;border-collapse:collapse;margin:8px 0 12px}
table.tec td{padding:7px 4px;border-bottom:1px solid var(--line)}
table.tec td:first-child{color:var(--muted);width:40%}
.tallas{display:flex;gap:8px;flex-wrap:wrap}
.tallas button{border:1.5px solid var(--sage);background:#fff;border-radius:10px;padding:6px 14px;cursor:pointer;font-weight:600}
.tallas button.on{background:var(--hunter);color:#fff;border-color:var(--hunter)}
.pago{background:#EEF2E6;border-left:4px solid var(--fern);padding:10px 14px;border-radius:8px;margin:12px 0;font-size:.92rem}
.acc{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.back{margin-bottom:12px}

/* Mapa */
.mapa{width:100%;height:auto;border-radius:12px;background:#E7E4D8;display:block}

/* Modal y toast */
.overlay{position:fixed;inset:0;background:rgba(35,50,41,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:20px;max-width:480px;width:100%;max-height:92vh;overflow:auto;padding:24px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.modal.wide{max-width:600px}
.modal label{display:block;margin:10px 0;font-weight:600;font-size:.9rem}
.modal select,.modal input[type=text],.modal input[type=number],.modal textarea{width:100%;border:1px solid var(--sage);border-radius:10px;padding:8px 10px;margin-top:4px;font-weight:400;background:#fff}
.modal fieldset{border:1px solid var(--line);border-radius:12px;margin:12px 0;padding:6px 14px}
.opt{font-weight:400!important;display:flex!important;gap:8px;align-items:center}
.qty{display:inline-flex;align-items:center;gap:14px;margin-top:4px}
.qty button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--fern);background:#fff;cursor:pointer;font-size:1.1rem}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.estr button{background:none;border:0;font-size:2rem;color:#C9C3B0;cursor:pointer;padding:0 2px}
.estr button.on{color:#C08A1E}
.ok-ic{width:60px;height:60px;border-radius:50%;background:var(--fern);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 12px}
.sample{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sample button{border:1.5px solid var(--sage);border-radius:12px;background:var(--cream);padding:8px;cursor:pointer}
.sample svg{width:100%}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--pine);color:#fff;padding:11px 22px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:var(--sh);max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}


/* ===== Resumen del vendedor ===== */
.rs-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:18px}
.rs-kpi{display:flex;gap:14px;align-items:center;padding:18px}
.rs-ico{flex:none;width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--dust);color:var(--pine)}
.rs-ico svg{width:22px;height:22px}
.rs-kpi b{display:block;font-family:Georgia,serif;font-size:1.65rem;color:var(--pine);line-height:1.1}
.rs-kpi span{font-size:.85rem;color:var(--muted)}
.rs-kpi .up{display:block;margin-top:2px}
.rs-kpi.alerta2{background:#FBF0D9;box-shadow:none;border:1px solid #E8CC8E}
.rs-kpi.alerta2 .rs-ico{background:#F3DDAA;color:#7a4e0c}
.rs-row{display:grid;gap:18px;margin-bottom:18px;align-items:stretch}
.rs-r2{grid-template-columns:1.35fr 1fr}
.rs-r3{grid-template-columns:1.15fr 1fr}
.rs-plan{padding:0;overflow:hidden;display:flex;flex-direction:column}
.rs-planhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:20px 24px;color:#fff;background:linear-gradient(135deg,var(--pine),var(--hunter))}
.rs-emprende .rs-planhead{background:linear-gradient(135deg,#4d5d52,#66776a)}
.rs-impulsa .rs-planhead{background:linear-gradient(135deg,var(--hunter),var(--fern))}
.rs-planhead h3{color:#fff;font-size:1.7rem;margin:0}
.rs-eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:700}
.rs-price b{font-family:Georgia,serif;font-size:1.6rem}.rs-price span{opacity:.85;margin-left:2px}
.rs-planbody{padding:18px 24px 22px;display:grid;grid-template-columns:1fr 1fr;gap:22px;flex:1}
.rs-meter .lbl{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:6px}
.rs-bar{height:10px;border-radius:99px;background:var(--dust);overflow:hidden}
.rs-bar i{display:block;height:100%;border-radius:99px;background:var(--fern)}
.rs-bar.full i{background:var(--amber)}
.rs-feat{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.rs-feat li{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.rs-feat .ck{flex:none;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--fern);color:#fff;margin-top:1px}
.rs-feat .ck svg{width:13px;height:13px}
.rs-feat .no .ck{background:var(--dust);color:var(--muted)}
.rs-feat .no{color:var(--muted)}
.rs-feat small{display:block;color:var(--muted)}
.rs-side h4{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:inherit;margin:0 0 10px}
.rs-prev{display:flex;gap:12px;align-items:center;background:var(--cream);border-radius:14px;padding:10px}
.rs-prev .im{position:relative;flex:none;width:76px;height:76px;border-radius:10px;overflow:hidden;background:var(--dust)}
.rs-prev .im img{width:100%;height:100%;object-fit:cover;display:block}
.rs-prev .im .tag{position:absolute;top:4px;left:4px;font-size:.6rem;padding:2px 6px}
.rs-prev b{display:block;font-size:.9rem;line-height:1.25}.rs-prev span{color:var(--hunter);font-weight:700}
.rs-note{font-size:.82rem;color:var(--muted);margin:10px 0 14px}
.rs-cta{margin-top:auto}
.rs-datos{list-style:none;margin:6px 0 0;padding:0}
.rs-datos li{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rs-datos li:first-child{border-top:0}
.rs-datos .rs-ico{width:38px;height:38px;border-radius:12px}
.rs-datos .rs-ico svg{width:18px;height:18px}
.rs-datos small{display:block;color:var(--muted);font-size:.78rem}
.rs-datos b{font-weight:600}
.rs-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px}
.rs-head h3{margin:0}.rs-sub{font-size:.85rem;color:var(--muted);margin:0 0 14px}
.rs-rank{display:grid;grid-template-columns:26px 1fr 40px;gap:12px;align-items:center;margin:11px 0}
.rs-rank .n{width:26px;height:26px;border-radius:50%;background:var(--dust);color:var(--pine);font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.rs-rank:first-of-type .n{background:var(--pine);color:#fff}
.rs-rank .t{display:flex;flex-direction:column;gap:5px;font-size:.95rem}
.rs-rank .bar2{height:8px;border-radius:99px;background:var(--dust);overflow:hidden}
.rs-rank .bar2 i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--fern),var(--hunter))}
.rs-rank b{text-align:right}
.rs-opp{background:linear-gradient(180deg,#FBF6E6,#fff 70%);border:1px solid #EADFB9}
.rs-oppi{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid #EFE6C6}
.rs-oppi:first-of-type{border-top:0}
.rs-oppi b{display:block;font-size:.95rem}.rs-oppi small{color:var(--muted)}
.rs-new{background:var(--amber);color:#fff;border-radius:99px;font-size:.66rem;font-weight:700;padding:2px 8px;margin-left:6px;vertical-align:middle}
.rs-pend .rs-head{margin-bottom:12px}
.rs-pill{display:inline-block;background:var(--amber);color:#fff;border-radius:99px;font-size:.8rem;font-weight:700;padding:1px 10px;margin-left:8px;vertical-align:middle;font-family:system-ui,sans-serif}
@media (max-width:1100px){.rs-kpis{grid-template-columns:repeat(2,1fr)}.rs-r2,.rs-r3{grid-template-columns:1fr}.rs-planbody{grid-template-columns:1fr}}


/* ===== Catálogo del vendedor ===== */
.cg-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 18px}
.cg-chips{display:flex;gap:8px;flex-wrap:wrap}
.cg-chips button{background:#fff;border:1.5px solid var(--sage);color:var(--pine);border-radius:99px;padding:7px 16px;font-weight:600;cursor:pointer}
.cg-chips button b{margin-left:6px;opacity:.7;font-weight:700}
.cg-chips button.on{background:var(--pine);border-color:var(--pine);color:#fff}
.cg-view{display:inline-flex;background:var(--dust);border-radius:99px;padding:3px}
.cg-view button{border:0;background:none;border-radius:99px;padding:6px 14px;font-weight:600;color:var(--muted);cursor:pointer}
.cg-view button.on{background:#fff;color:var(--pine);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.cg-card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;border:2px solid transparent}
.cg-card.agot{border-color:#E8CC8E}
.cg-card.borr{border:2px dashed var(--sage);box-shadow:none}
.cg-img{position:relative;aspect-ratio:1/1;background:linear-gradient(145deg,#ECE8DC,var(--dust))}
.cg-img{display:flex;align-items:center;justify-content:center}.cg-img>svg{width:55%;height:auto}
.cg-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cg-img img{background:#ECE8DC}
.cg-card.agot .cg-img img,.cg-card.borr .cg-img img{filter:grayscale(.9) brightness(1.1) contrast(.8)}

let state = estadoInicial();

const $ = s => document.querySelector(s);
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const producto = id => state.productos.find(p=>p.id===id);

const km = n => n.toFixed(1).replace('.',',') + ' km';
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);

let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3200);}

/* ---------- Imágenes SVG ---------- */
function sombra(hex,f){const n=parseInt(hex.slice(1),16);return '#'+[(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.min(255,Math.round(v*f)).toString(16).padStart(2,'0')).join('');}
// Dibuja la prenda (camisa, pantalón, vestido, bermuda, falda) pintada con el color del producto
function prenda(tipo,color,largo){
  const c=COLORES[color]||'#A3B18A', d=sombra(c,.68); let s=''; const gid='g'+(prenda.n=(prenda.n||0)+1);
  if(tipo==='camisa'){
    s=`<path d="M30 16 L43 11 Q50 20 57 11 L70 16 L91 36 L81 47 L72 40 L72 90 L28 90 L28 40 L19 47 L9 36 Z"/>
       <path d="M43 11 L50 27 L57 11" fill="none"/><path d="M50 27 L50 90" fill="none" stroke-dasharray="2 3"/>
       <circle cx="50" cy="40" r="1.3" fill="${d}"/><circle cx="50" cy="54" r="1.3" fill="${d}"/><circle cx="50" cy="68" r="1.3" fill="${d}"/>`;
  }else if(tipo==='pantalon'){
    s=`<path d="M30 8 L70 8 L74 92 L55 92 L50 36 L45 92 L26 92 Z"/><path d="M30 15 L70 15" fill="none"/><path d="M50 15 L50 36" fill="none"/>`;
  }else if(tipo==='vestido'){
    const b=largo==='corto'?66:largo==='midi'?82:94;
    s=`<path d="M38 8 L45 8 L50 17 L55 8 L62 8 L61 38 L${80-(94-b)*.2} ${b} L${20+(94-b)*.2} ${b} L39 38 Z"/><path d="M39 38 L61 38" fill="none"/>`;
  }else if(tipo==='bermuda'){
    s=`<path d="M28 20 L72 20 L76 64 L55 64 L50 40 L45 64 L24 64 Z"/><path d="M28 27 L72 27" fill="none"/>`;
  }else if(tipo==='bolso'){
    s=`<path d="M26 40 L74 40 L80 88 L20 88 Z"/><path d="M36 40 Q36 14 50 14 Q64 14 64 40" fill="none"/><path d="M26 52 L76 52" fill="none"/><circle cx="50" cy="52" r="2" fill="${d}"/>`;
  }else if(tipo==='gorra'){
    s=`<path d="M20 62 Q20 28 52 28 Q82 28 82 62 Z"/><path d="M18 62 Q50 74 94 62 Q60 56 18 62 Z"/><circle cx="52" cy="28" r="2.2" fill="${d}"/>`;
  }else if(tipo==='cinturon'){
    s=`<rect x="6" y="43" width="88" height="14" rx="3"/><rect x="42" y="38" width="16" height="24" rx="3" fill="none"/><circle cx="22" cy="50" r="1.4" fill="${d}"/><circle cx="30" cy="50" r="1.4" fill="${d}"/><circle cx="70" cy="50" r="1.4" fill="${d}"/>`;
  }else{ // falda
    const b=largo==='corto'?62:largo==='midi'?78:90;
    s=`<path d="M36 20 L64 20 L${82+(b-78)*.2} ${b} L${18-(b-78)*.2} ${b} Z"/><path d="M36 28 L64 28" fill="none"/>`;
  }
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${sombra(c,1.12)}"/><stop offset=".55" stop-color="${c}"/><stop offset="1" stop-color="${sombra(c,.8)}"/></linearGradient></defs><g fill="url(#${gid})" stroke="${d}" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">${s}</g></svg>`;
}

// Mapa simple (SVG): calles, tiendas y punto "Tú"
function mapa(lista,foco){
  if(typeof L==='undefined') return mapaSVG(lista,foco);
  return `<div class="lmap" data-ids="${lista.map(t=>t.id).join(',')}" data-foco="${foco||''}"></div>`;
}
let mapas=[];
function initMapas(){
  mapas.forEach(m=>m.remove()); mapas=[];
  if(typeof L==='undefined') return;
  document.querySelectorAll('.lmap').forEach(el=>{
    const ids=el.dataset.ids.split(',').filter(Boolean).map(Number), foco=+el.dataset.foco, pts=[USER];
    const m=L.map(el,{scrollWheelZoom:false}).setView(foco?LL[foco]:USER,foco?15:13);
    const esri=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri · OpenStreetMap contributors'}).addTo(m);
    let fallo=0; esri.on('tileerror',()=>{ if(++fallo===3){ m.removeLayer(esri); L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m); }});
    L.circleMarker(USER,{radius:8,color:'#fff',weight:2,fillColor:'#2563eb',fillOpacity:1}).addTo(m).bindPopup('Tú estás aquí');
    ids.forEach(id=>{const t=tienda(id); pts.push(LL[id]);
      L.marker(LL[id]).addTo(m).bindPopup(`<b>${esc(t.nombre)}</b> ${t.nivel==='Verificado'?'✓':''}<br>${esc(t.dir)}<br>${esc(t.horario)} · ${km(t.km)}<br><button class="link" data-act="tienda" data-id="${id}">Ver tienda</button> · <a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${LL[id]}">Cómo llegar</a>`);});
    if(!foco&&pts.length>1) m.fitBounds(pts,{padding:[30,30]});
    mapas.push(m);
  });
}
function mapaSVG(lista,foco){
  const pts=lista.map(t=>`<g data-act="tienda" data-id="${t.id}" style="cursor:pointer"><title>${esc(t.nombre)} · ${km(t.km)}</title>
    <circle cx="${t.x}" cy="${t.y}" r="${t.id===foco?4.6:3.4}" fill="${t.nivel==='Verificado'?'#588157':'#A3B18A'}" stroke="#344E41" stroke-width="1"/>
    <text x="${t.x}" y="${t.y-5.5}" font-size="3.3" text-anchor="middle" fill="#344E41" font-weight="700">${esc(t.nombre)}</text></g>`).join('');
  return `<svg class="mapa" viewBox="0 0 100 72" role="img" aria-label="Mapa simple de tiendas">
   <rect width="100" height="72" fill="#E7E4D8"/><rect x="62" y="48" width="30" height="18" rx="4" fill="#C9D4B4"/>
   <g stroke="#fff" stroke-width="2.2" fill="none"><path d="M0 30 H100"/><path d="M0 56 H100"/><path d="M20 0 V72"/><path d="M48 0 V72"/><path d="M76 0 V72"/><path d="M0 8 L100 20" stroke-width="1.3"/></g>
   ${pts}
   <circle cx="50" cy="44" r="7" fill="#344E41" opacity=".15"/><circle cx="50" cy="44" r="3" fill="#344E41" stroke="#fff" stroke-width="1"/>
   <text x="50" y="52" font-size="3.3" text-anchor="middle" fill="#344E41" font-weight="700">Tú</text></svg>`;
}

/* ---------- Piezas de interfaz ---------- */
const badge = n => n==='Verificado'
  ? `<span class="bd v" title="Nivel 2: ubicación, teléfono y registro legal validados">✓ Verificado</span>`
  : `<span class="bd i" title="Nivel 1: ubicación y teléfono validados">● Identificado</span>`;
const etiquetaPlan = t => { const e=PLANES[t.plan].etq; return e?`<span class="tag ${e==='Destacado'?'dest':'prio'}">${e}</span>`:''; };
function estrellas(p){
  if(!p.res) return '<span class="muted small">Sin reseñas aún</span>';
  const n=Math.round(p.cal);
  return `<span class="stars" aria-label="${p.cal.toFixed(1)} de 5">${'★'.repeat(n)}${'☆'.repeat(5-n)}</span> <b>${p.cal.toFixed(1)}</b> <span class="muted">· ${p.res} reseñas</span>`;
}
function tarjeta(p){
  const t=tienda(p.tienda);
  return `<article class="card prod" data-act="ficha" data-id="${p.id}" tabindex="0" role="button" aria-label="Ver ${esc(p.nombre)}">
   <div class="img">${prenda(p.tipo,p.colores[0],p.largo)}${foto(p)}${etiquetaPlan(t)}</div>
   <div class="body"><h3>${esc(p.nombre)}</h3><div class="precio">${fmt(p.precio)}</div>
    <div class="small">${esc(t.nombre)} ${badge(t.nivel)}</div>
    <div class="small">${estrellas(p)}</div>
    <div class="small muted">${esc(t.barrio)} · ${km(t.km)}</div>
    <div class="tags">${p.online?'<span class="tg">En línea</span>':''}${p.fisico?'<span class="tg">En tienda</span>':''}</div></div></article>`;
}

/* ---------- 3. BÚSQUEDA SIMULADA CON REGLAS (sin IA real) ---------- */
const TIPOS_RE = [['camisa',/\b(camisas?|camisetas?|blusas?)\b/],['pantalon',/\b(pantalon(es)?|jeans?)\b/],['vestido',/\bvestidos?\b/],['bermuda',/\b(bermudas?|shorts?)\b/],['falda',/\bfaldas?\b/],['bolso',/\b(bolsos?|carteras?|morrales?)\b/],['gorra',/\b(gorras?|sombreros?)\b/],['cinturon',/\b(cinturon(es)?|correas?)\b/]];
const COLOR_RE = [['beige',/\b(beige|crema|arena)\b/],['verde',/\b(verde|esmeralda)\b/],['negro',/\bnegr[oa]s?\b/],['blanco',/\bblanc[oa]s?\b/],['azul',/\bazul(es)?\b/],['gris',/\bgris(es)?\b/],['terracota',/\b(terracota|naranja)\b/],['mostaza',/\b(mostaza|amarill[oa])\b/],['rojo',/\broj[oa]s?\b/]];
const ESTILO_RE = [['graduación',/\b(graduacion|grado|grados)\b/],['oficina',/\b(oficina|trabajo)\b/],['elegante',/\b(elegante|gala|fiesta|matrimonio)\b/],['casual',/\bcasual\b/],['oversize',/\boversize\b/],['slim',/\bslim\b/],['deportivo',/\b(deportiv[oa]|deporte|gym)\b/]];
const STOP = new Set(['busco','quiero','necesito','unas','unos','para','con','por','los','las','del','talla','tallas','hasta','menos','algo','cerca','mismo','como','muy','tipo','tengo','dame','mostrar','mil']);

// Interpreta una frase en lenguaje natural y devuelve filtros + palabras sueltas
function interpretar(texto){
  const t=' '+norm(texto)+' ', f={};
  for(const [k,re] of TIPOS_RE) if(re.test(t)){f.tipo=k;break;}
  for(const [k,re] of COLOR_RE) if(re.test(t)){f.color=k;break;}
  const mt=t.match(/\btallas?\s*(xxl|xl|xs|s|m|l|\d{2})\b/); if(mt) f.talla=mt[1].toUpperCase();
  if(/\bcuero\b/.test(t)) f.tela='cuero'; else if(/\blino\b/.test(t)) f.tela='lino'; else if(/\balgodon\b/.test(t)) f.tela='algodón'; else if(/\b(mezcla|satin|poliester)\b/.test(t)) f.tela='mezcla';
  const mp=t.match(/\b(?:hasta|menos de|maximo|max|por debajo de|no mas de)\s*\$?\s*([\d.,]+)\s*(mil|k)?\b/);
  if(mp){let n=parseInt(mp[1].replace(/[.,]/g,''),10); if(!isNaN(n)){ if(mp[2]||n<1000) n*=1000; f.max=n; }}
  if(/\b(cerca|cercano|cercanas?|cerquita)\b/.test(t)) f.cerca=true;
  if(/\blarg[oa]s?\b/.test(t)) f.largo='largo'; else if(/\bcort[oa]s?\b/.test(t)) f.largo='corto'; else if(/\bmidi\b/.test(t)) f.largo='midi';
  if(f.largo && ['camisa','pantalon','bermuda'].includes(f.tipo)) delete f.largo;   // "manga larga" no es largo de vestido
  for(const [k,re] of ESTILO_RE) if(re.test(t)){f.estilo=k;break;}
  const mpa=t.match(/\b(?:fabricad[oa]s?|hech[oa]s?)\s+en\s+(colombia|peru|china)\b/); if(mpa) f.pais={colombia:'Colombia',peru:'Perú',china:'China'}[mpa[1]];
  const tokens=t.replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>=4&&!STOP.has(w)&&!/^\d+$/.test(w)).map(w=>w.length>4&&w.endsWith('s')?w.slice(0,-1):w);
  return {filtros:f,tokens};
}
const textoProd = p => norm([p.nombre,p.desc,p.estilo,p.tela,p.tipo,p.colores.join(' ')].join(' '));

// Filtros duros: lo que el usuario pidió explícitamente debe cumplirse
function coincide(p,f,tokens){
  const t=tienda(p.tienda);
  if(f.tipo&&p.tipo!==f.tipo) return false;
  if(f.color&&!p.colores.includes(f.color)) return false;
  if(f.talla&&!p.tallas.includes(f.talla)) return false;
  if(f.tela&&p.tela!==f.tela) return false;
  if(f.largo&&p.largo!==f.largo) return false;
  if(f.max&&p.precio>f.max) return false;
  if(f.pais&&p.pais!==f.pais) return false;
  if(f.cerca&&t.km>2) return false;
  if(!Object.keys(f).length&&tokens.length){const tx=textoProd(p);return tokens.some(k=>tx.includes(k));}
  return true;
}
// Puntaje de RELEVANCIA (el plan NO suma aquí: solo desempata después)
function relevancia(p,f,tokens){
  let s=0;
  if(f.tipo)s+=40; if(f.color)s+=p.colores[0]===f.color?20:10; if(f.tela)s+=20; if(f.talla)s+=15;
  if(f.largo)s+=15; if(f.max)s+=5; if(f.pais)s+=5; if(f.cerca)s+=5;
  if(f.estilo&&p.estilo===f.estilo)s+=25;
  const nm=norm(p.nombre), tx=textoProd(p);
  tokens.forEach(k=>{ if(nm.includes(k))s+=3; else if(tx.includes(k))s+=1; });
  return s;
}
// Orden final: relevancia ↓, luego plan (Crece → Impulsa → Emprende), luego calificación
function buscar(){
  const {filtros:f,tokens}=state.busqueda;
  return state.productos.filter(p=>visible(p)&&coincide(p,f,tokens))
    .map(p=>({p,s:relevancia(p,f,tokens)}))
    .sort((a,b)=>b.s-a.s || PLANES[tienda(a.p.tienda).plan].rank-PLANES[tienda(b.p.tienda).plan].rank || b.p.cal-a.p.cal)
    .map(x=>x.p);
}
function lanzarBusqueda(texto){
  const b=state.busqueda; b.draft=texto; b.texto=texto.trim();
  if(b.texto){const r=interpretar(b.texto); b.filtros=r.filtros; b.tokens=r.tokens;} else {b.filtros={};b.tokens=[];}
  if(b.texto) state.bus.push({q:b.texto,n:buscar().length});
  state.vista='buscar'; render();
}

function resenasSemilla(p){
  const pool=RES_POOL[p.tipo]||RES_POOL.camisa, k=p.id%3;
  const arma=(lista,off)=>lista.map((r,i)=>({e:r[0],txt:r[1],resp:r[2],autor:RES_NOMBRES[(p.id+i+off)%RES_NOMBRES.length],fecha:RES_FECHAS[(i+off+k)%RES_FECHAS.length]}));
  return {dest:arma(rot(pool.slice(0,3),k),0), mas:arma(rot(pool.slice(3),k),4)};
}
// Reparte N reseñas en 5..1 estrellas de modo que el promedio coincida con 'media'
function distribucion(media,n){
  if(n<=0) return [0,0,0,0,0];
  media=Math.min(4.98,Math.max(1.02,media));
  const f=t=>{const w=[1,2,3,4,5].map(k=>Math.exp(t*k)),S=w.reduce((a,b)=>a+b,0);return {w,S,m:w.reduce((a,x,i)=>a+x*(i+1),0)/S};};
  let lo=-6,hi=10; for(let i=0;i<60;i++){const mid=(lo+hi)/2; f(mid).m<media?lo=mid:hi=mid;}
  const {w,S}=f((lo+hi)/2), ex=w.map(x=>x/S*n), c=ex.map(Math.floor);
  let rest=n-c.reduce((a,b)=>a+b,0);
  ex.map((x,i)=>[x-Math.floor(x),i]).sort((a,b)=>b[0]-a[0]).slice(0,rest).forEach(([,i])=>c[i]++);
  return c.reverse(); // índice 0 = 5 estrellas
}

// Cifras de un mes = historial + (solo octubre) los pedidos reales de la tienda en esta sesión
function datosInforme(mes){
  const H=HIST[mes], d={ped:H.ped,ing:H.ing,uni:0,online:H.online,tienda:H.ped-H.online,sem:[...H.sem],semIng:[...H.semIng],prods:{},pend:0,pendIng:0};
  Object.entries(H.prods).forEach(([k,[u,i]])=>{d.prods[k]={u,ing:i};d.uni+=u;});
  if(MESES[mes].vivo) pedidosT().forEach(o=>{
    const k=String(pidDe(o)), ult=d.sem.length-1, pr=d.prods[k]=d.prods[k]||{u:0,ing:0};
    d.ped++; d.ing+=o.total; d.uni+=o.qty; pr.u+=o.qty; pr.ing+=o.total;
    d.sem[ult]++; d.semIng[ult]+=o.total;
    if(o.canal==='tienda') d.tienda++; else d.online++;
    if(o.estado==='Pago por confirmar'){d.pend++; d.pendIng+=o.total;}
  });
  return d;
}

  return p>0 ? `<span class="up">▲ ${fp(p)} vs. ${vs}</span>` : `<span class="up dn">▼ ${fp(p)} vs. ${vs}</span>`;
}

// Carga asistida de producto (la "IA" es simulada con reglas)
const TIPOS_L=['camisa','pantalon','vestido','bermuda','falda','bolso','gorra','cinturon'], COLS_L=['beige','blanco','verde','azul','negro','terracota'];
function sugerir(nombre,tam){
  const n=' '+norm(nombre)+' '; let tipo=null,color=null;
  for(const [k,re] of TIPOS_RE) if(re.test(n)){tipo=k;break;}
  for(const [k,re] of COLOR_RE) if(re.test(n)){color=k;break;}
  if(!tipo) tipo=TIPOS_L[(n.length+tam)%TIPOS_L.length];
  if(!color) color=COLS_L[(n.length*3+tam)%6];
  const tela=['lino','algodón','mezcla'][(n.length+tam)%3];
  return {tipo,color,tela,nombre:`${cap(tipo==='pantalon'?'pantalón':tipo)} ${color}`,
    txt:`${cap(tipo==='pantalon'?'pantalón':tipo)} de ${tela} en color ${color}. Cómodo, fresco y listo para el clima de Cúcuta.`,precio:60000};
}

   <div><label>Categoría<select data-m="tipo" data-rr="1">${TIPOS_L.map(x=>`<option value="${x}" ${x===m.tipo?'selected':''}>${cap(x==='pantalon'?'pantalón':x)}</option>`).join('')}</select></label>
   <label>Color<select data-m="color" data-rr="1">${Object.keys(COLORES).map(x=>`<option ${x===m.color?'selected':''}>${x}</option>`).join('')}</select></label>
   <label>Tela<select data-m="tela">${['lino','algodón','mezcla'].map(x=>`<option ${x===m.tela?'selected':''}>${x}</option>`).join('')}</select></label></div></div>
   <label>Nombre<input type="text" data-m="nombre" value="${esc(m.nombre)}"></label>

/* ---------- 6. ACCIONES Y EVENTOS ---------- */
function cambiarEstado(id){
  const o=state.pedidos.find(x=>x.id===id); if(!o||!SIG[o.estado]) return;
  o.estado=SIG[o.estado][1]; toast(`Pedido #${o.id}: ${o.estado}`); render();
}
const NOM={tarjeta:'tarjeta',nequi:'Nequi',pse:'PSE',tienda:'en tienda'};
const luhn=s=>s.length>=13&&[...s].reverse().reduce((a,d,i)=>{d=+d;if(i%2){d*=2;if(d>9)d-=9;}return a+d;},0)%10===0;
function pagar(m){
  const M=m.metodo||'tarjeta';
  if(M==='tarjeta'){const n=(m.cn||'').replace(/\D/g,'');
    if(!luhn(n)){m.err='Número de tarjeta inválido.';return;}
    if(!/^(0[1-9]|1[0-2])\/\d{2}$/.test(m.cv||'')){m.err='Fecha inválida (MM/AA).';return;}
    if(!/^\d{3,4}$/.test(m.cc||'')){m.err='CVV inválido.';return;}
    if(!(m.cname||'').trim()){m.err='Escribe el nombre de la tarjeta.';return;}
    m.rech=n==='4000000000000002';}
  if(M==='nequi'&&!/^3\d{9}$/.test(m.tel||'')){m.err='Celular inválido (10 dígitos, empieza por 3).';return;}
  m.err=''; m.proc=true; renderModal();
  setTimeout(()=>{ if(state.modal!==m) return;
    if(m.rech){m.proc=false;m.rech=false;m.err='Pago rechazado por el banco. Intenta con otro medio.';renderModal();return;}
    if(M!=='tienda') m.ref='PC-'+Math.random().toString(36).slice(2,8).toUpperCase();
    crearPedido(m); render();},1600);
}
function crearPedido(m){
  const p=producto(m.pid), id=state.proxPedido++;
  state.pedidos.push({id,pid:p.id,tienda:p.tienda,label:`${p.nombre} · ${m.talla}`,talla:m.talla,qty:m.qty,total:p.precio*m.qty,canal:m.canal,estado:m.canal==='tienda'?'Recoger en tienda':'Por enviar',pagado:!!m.ref,ref:m.ref||'',metodo:NOM[m.metodo]||'',mine:true,cliente:'Tú (comprador demo)',hora:'Hoy · '+new Date().toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'}),img:p.foto||('img/p'+p.id+'.jpg')});
  p.stock=Math.max(0,p.stock-m.qty); m.hecho=id;
}
function enviarResena(m){
  const o=state.pedidos.find(x=>x.id===m.oid), p=producto(o.pid);
  p.cal=Math.round(((p.cal*p.res+m.e)/(p.res+1))*10)/10; p.res+=1; o.resena=m.e;
  state.resenas.push({pid:p.id,e:m.e,txt:m.txt.trim(),autor:'Tú',fecha:new Date().toLocaleDateString('es-CO')});
  toast('¡Gracias! Tu reseña ya cuenta en la calificación.');
}
function publicarNuevo(modo){
  const m=state.modal; const precio=parseInt(m.precio,10);
  if(!m.nombre.trim()||!(precio>0)){toast('Escribe un nombre y un precio válido.');return;}
  state.productos.push({id:state.proxProd++,nombre:m.nombre.trim(),tienda:1,precio,tela:m.tela,pais:'Colombia',tallas:['bolso','gorra'].includes(m.tipo)?['Única']:m.tipo==='pantalon'?['30','32','34','36']:['S','M','L','XL'],colores:[m.color],tipo:m.tipo,estilo:'casual',largo:m.tipo==='vestido'||m.tipo==='falda'?'largo':undefined,stock:5,cal:0,res:0,online:true,fisico:true,estado:modo,foto:m.foto||'',desc:m.txt.trim()||'Producto nuevo.'});
  cerrarModal(); toast(modo==='Publicado'?'Producto publicado. Ya aparece en el buscador.':'Guardado como borrador.'); render();
}

      state.busqueda={draft:`Búsqueda por imagen: ${n} ${d.c}`,texto:'imagen',filtros:{tipo:d.t,color:d.c},tokens:[]};
      state.modal=null; render(); toast('Búsqueda por imagen simulada: reconocimos prenda y color.'); break;}
    case 'talla': state.talla=d.t; render(); break;
    case 'pedir': {const p=producto(+d.id); abrirModal({k:'pedido',pid:p.id,talla:state.talla||p.tallas[0],qty:1,canal:p.fisico&&!p.online?'tienda':'online'}); break;}
    case 'qty': {const p=producto(m.pid); m.qty=Math.max(1,Math.min(Math.min(10,p.stock),m.qty+(+d.d))); renderModal(); break;}
    case 'irPago': m.paso='pago'; m.metodo='tarjeta'; m.err=''; renderModal(); break;
    case 'metodo': m.metodo=d.k; m.err=''; renderModal(); break;
    case 'atras': m.paso=null; renderModal(); break;
    case 'pagar': pagar(m); renderModal(); break;
    case 'geo': navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{USER=[p.coords.latitude,p.coords.longitude];calcKm();state.tiendas.forEach(t=>t.km=TIENDAS.find(x=>x.id===t.id).km);toast('Ubicación actualizada');render();},()=>toast('No pudimos obtener tu ubicación.')):toast('Tu navegador no permite ubicación.'); break;
    case 'cerrar': cerrarModal(); break;
    case 'verPedidos': state.modal=null; ir('pedidos'); break;
    case 'resena': abrirModal({k:'resena',oid:+d.id,e:5,txt:''}); break;
    case 'masResenas': state.resMas[+d.id]=!state.resMas[+d.id]; render(); break;
    case 'guia': abrirModal({k:'guia',pid:+d.id}); break;
    case 'estrella': m.e=+d.n; renderModal(); break;
    case 'enviarResena': enviarResena(m); state.modal=null; render(); break;
    case 'tab': state.tab=d.t; state.reporte=null; render(); break;
    case 'pedfiltro': state.pedFiltro=d.f; render(); break;
    case 'catvista': state.catVista=d.v; render(); break;
    case 'catfiltro': state.catFiltro=d.f; render(); break;
    case 'avanzar': cambiarEstado(+d.id); break;
    case 'nuevo': if(state.productos.filter(p=>p.tienda===1).length>=PLANES[state.planDemo].limite){toast('Llegaste al límite de productos de tu plan.');break;} abrirModal({k:'nuevo',paso:0}); break;
    case 'ejemploFoto': Object.assign(m,sugerir('camisa_beige_ejemplo.jpg',7),{paso:1,foto:null}); renderModal(); break;
    case 'publicar': publicarNuevo(d.modo); break;
    case 'estadoProd': {const p=producto(+d.id); p.estado=d.to; toast(d.to==='Publicado'?'Producto publicado.':'Producto pasado a borrador.'); render(); break;}
    case 'reponer': producto(+d.id).stock=10; toast('Stock repuesto: 10 unidades.'); render(); break;
    case 'mejorar': state.planDemo='Crece'; tienda(1).plan='Crece'; toast('Ahora ves la tienda con plan Crece.'); render(); break;
    case 'generar': { const marca=new Date().toLocaleString('es-CO').replace(/\.$/,''); state.reporte=marca; toast('Reporte de '+MESES[state.infMes].corto+' 2026 generado.'); render(); setTimeout(()=>{ if(state.reporte===marca){ state.reporte=null; if(state.tab==='informe') render(); } },8000); break; }
    case 'infmes': state.infMes=d.mes; state.reporte=null; render(); break;
    case 'cerrarReporte': state.reporte=null; render(); break;
    case 'pdf': window.print(); break;
    case 'reiniciar': state=estadoInicial(); render(); window.scrollTo(0,0); toast('Demo reiniciada.'); break;
  }
});
// Tarjetas accesibles con teclado
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&state.modal) cerrarModal();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.prod[data-act]')){e.preventDefault();e.target.click();}
});
// Búsqueda por texto
document.addEventListener('submit',e=>{
  if(e.target.dataset.form==='chat'){e.preventDefault();const p=producto(+e.target.dataset.id),q=(new FormData(e.target).get('q')||'').trim();if(q){const c=state.chats[p.id]=state.chats[p.id]||[];c.push(['u',q],['a',responder(p,q)]);render();}return;}
  if(e.target.dataset.form==='buscar'){e.preventDefault();lanzarBusqueda(new FormData(e.target).get('q')||'');}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q') state.busqueda.draft=e.target.value;
  campoModal(e.target,false);
});
// Filtros manuales, selector de plan y campos de los modales
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='archivo'&&el.files&&el.files[0]){            // carga de foto → propuesta simulada
    const fl=el.files[0], rd=new FileReader();
    rd.onload=()=>{Object.assign(state.modal,sugerir(fl.name,fl.size),{paso:1,foto:rd.result});renderModal();};
    rd.readAsDataURL(fl); return;
  }
  if(campoModal(el,true)) return;
  const k=el.dataset.f; if(!k) return;
  const f=state.busqueda.filtros;
  if(k==='planDemo'){state.planDemo=el.value;tienda(1).plan=el.value;render();return;}
  if(k==='qtienda'){state.qtienda=el.value;render();return;}
  if(k==='cerca'){ if(el.checked) f.cerca=true; else delete f.cerca; }
  else if(k==='max'){ const n=parseInt(el.value,10); if(n>0) f.max=n; else delete f.max; }
  else { if(el.value) f[k]=el.value; else delete f[k]; }
  render();
});
function campoModal(el,fin){
  const c=el.dataset&&el.dataset.m; if(!c||!state.modal) return false;
  let v=el.value; if(c==='qty') v=+v;
  state.modal[c]=v;
  if(fin&&el.dataset.rr) renderModal();
  return true;
}

render();
</script>
</body>
